name: Better Auth session storage proof

on:
  pull_request:
    paths:
      - "validation/better-auth-sessions/**"
      - ".github/workflows/better-auth-sessions.yml"
  push:
    branches: [main]
    paths:
      - "validation/better-auth-sessions/**"
      - ".github/workflows/better-auth-sessions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: validation/better-auth-sessions
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: validation/better-auth-sessions/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - run: npm test
